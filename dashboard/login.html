<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход — Bank Intelligence Platform</title>
<style>
  :root {
    --bg: #f6f8fb;
    --primary: #2563eb;
    --primary-2: #1d4ed8;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #fbfdff 0%, var(--bg) 42%, #eef3fb 100%);
    color: var(--text);
  }
  .card {
    width: 340px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, .08);
  }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), #60a5fa);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 18px; margin-bottom: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 10px; font-size: 14px;
    background: #f8fafc; color: var(--text); outline: none;
  }
  input:focus { border-color: var(--primary); background: #fff; }
  button {
    width: 100%; padding: 11px; border: 0; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error {
    display: none; margin-bottom: 16px; padding: 9px 12px; border-radius: 10px;
    background: #fef2f2; border: 1px solid #fecaca; color: var(--danger);
    font-size: 12.5px; font-weight: 600;
  }
</style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="on">
    <div class="logo">BI</div>
    <h1>Bank Intelligence Platform</h1>
    <p class="sub">Войдите, чтобы продолжить</p>
    <div class="error" id="error-box"></div>
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" required autofocus />
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="submit-btn">Войти</button>
  </form>

<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Входим…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        showError(data.detail || 'Не удалось войти');
        return;
      }
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      location.href = (next && next.startsWith('/')) ? next : '/dashboard/index.html';
    } catch (err) {
      showError('Сервер недоступен: ' + (err.message || err));
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Войти';
    }
  });
</script>
</body>
</html>
