<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Менеджер банкоматов</title>
<style>
  :root {
    --bg: #12151f;
    --bg-panel: #171b26;
    --bg-header: #1c212e;
    --bg-row-hover: #1e2330;
    --border: #262b3a;
    --text: #e8eaf0;
    --text-dim: #8a90a3;
    --accent-blue: #3b82f6;
    --accent-blue-dim: #2a3550;
    --green: #22c55e;
    --green-bg: #16351f;
    --orange: #f5a623;
    --orange-bg: #3a2a12;
    --red: #ef4444;
    --red-bg: #3a1a1a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 8px;
  }
  .brand-title { font-size: 17px; font-weight: 600; }
  .top-right { display: flex; align-items: center; gap: 22px; color: var(--text-dim); }
  .top-right .item { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #22c55e; color: #0b2013; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .lang-badge {
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 6px; font-size: 12px; color: var(--text-dim);
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 32px;
    padding: 0 28px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 14px 2px; color: var(--text-dim); cursor: pointer;
    border-bottom: 2px solid transparent; font-size: 14px;
    user-select: none;
  }
  .tab.disabled { opacity: 0.35; cursor: default; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent-blue); font-weight: 500; }

  /* ---------- Content ---------- */
  .content { padding: 24px 28px; }
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-toolbar {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .search-box {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-header);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text-dim);
  }
  .search-box input {
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 14px; width: 100%;
  }
  .icon-btn {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); border-radius: 6px; cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-header); }

  .filter-row {
    display: flex; gap: 8px;
    padding: 14px 16px;
  }
  .pill {
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    color: var(--text-dim); background: transparent; font-size: 13px;
    border: 1px solid transparent;
  }
  .pill.active { background: var(--accent-blue); color: white; }
  .pill:not(.active):hover { background: var(--bg-header); }

  /* ---------- Table ---------- */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 12px 16px;
    color: var(--text-dim); font-weight: 500; font-size: 13px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--bg-row-hover); }
  .id-link { color: var(--accent-blue); text-decoration: none; font-weight: 500; }
  .id-link:hover { text-decoration: underline; }
  .muted { color: var(--text-dim); }

  .badge {
    display: inline-block; min-width: 30px; text-align: center;
    padding: 3px 8px; margin: 2px 3px 2px 0; border-radius: 5px;
    font-size: 12.5px; font-weight: 600;
  }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .badge.low { background: var(--orange-bg); color: var(--orange); }
  .badge.missing { background: var(--red-bg); color: var(--red); }
  .badge.unknown { background: var(--bg-header); color: var(--text-dim); }

  .forecast { color: var(--green); font-weight: 500; }

  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.online { background: var(--green); }
  .status-dot.offline { background: var(--red); }

  .empty-state {
    padding: 60px 20px; text-align: center; color: var(--text-dim);
  }
  .footer-note {
    padding: 10px 16px; color: var(--text-dim); font-size: 12px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M2 12h4l2 7 4-14 2 7h8" stroke="#12151f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-title">Менеджер банкоматов</div>
    </div>
    <div class="top-right">
      <span class="lang-badge">RU</span>
      <div class="avatar">AO</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab" data-status="production">На обслуживании</div>
    <div class="tab disabled">Фокус группа</div>
    <div class="tab disabled">Перемещение</div>
    <div class="tab disabled">Склад</div>
    <div class="tab disabled">Лаборатория</div>
    <div class="tab disabled">Закрыт</div>
    <div class="tab active" data-status="">Все</div>
  </div>

  <div class="content">
    <div class="panel">
      <div class="panel-toolbar">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#8a90a3" stroke-width="2"/><path d="M21 21l-4-4" stroke="#8a90a3" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="text" placeholder="Введите запрос" />
        </div>
        <div class="icon-btn" title="Обновить" onclick="loadAtms()">⟳</div>
      </div>

      <div class="filter-row">
        <div class="pill" data-conn="online">На связи</div>
        <div class="pill" data-conn="offline">Нет связи</div>
        <div class="pill active" data-conn="">Все</div>
      </div>

      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Идентификатор</th>
              <th>Серийный Номер</th>
              <th>Кассеты CDM</th>
              <th>Общий остаток</th>
              <th>Прогноз</th>
              <th>Производитель</th>
              <th>Модель</th>
              <th>Вариант</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" class="empty-state">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="footer-note" id="footerNote"></div>
    </div>
  </div>

<script>
let allAtms = [];
let statusFilter = "";
let connFilter = "";
let searchQuery = "";

function fmtMoney(value) {
  if (value === null || value === undefined) return "—";
  return "UZS " + Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function cassetteBadgeClass(status) {
  if (status === "OK") return "ok";
  if (status === "LOW") return "low";
  if (status === "MISSING") return "missing";
  return "unknown";
}

function renderCassettes(cassettes) {
  if (!cassettes || cassettes.length === 0) return '<span class="muted">—</span>';
  return cassettes
    .map(c => `<span class="badge ${cassetteBadgeClass(c.status)}" title="${c.type || ''} · номинал ${c.nominal ?? '?'}">${c.count ?? 0}</span>`)
    .join("");
}

function applyFilters() {
  let rows = allAtms;
  if (statusFilter) rows = rows.filter(a => a.status === statusFilter);
  if (connFilter) rows = rows.filter(a => (a.agent_status || "").toLowerCase() === connFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    rows = rows.filter(a =>
      (a.tid || "").toLowerCase().includes(q) ||
      (a.serial || "").toLowerCase().includes(q)
    );
  }
  renderRows(rows);
}

function renderRows(rows) {
  const tbody = document.getElementById("tableBody");
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Ничего не найдено</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(a => `
    <tr>
      <td><a class="id-link" href="#">${a.tid ?? a.id}</a></td>
      <td>${a.serial ?? "—"}</td>
      <td>${renderCassettes(a.cassettes)}</td>
      <td>${fmtMoney(a.cdm_total_uzs)}</td>
      <td>${a.forecast ? `<span class="forecast">${a.forecast}</span>` : ""}</td>
      <td>${a.vendor ?? "—"}</td>
      <td>${a.model ?? "—"}</td>
      <td>${a.variant ?? "—"}</td>
    </tr>
  `).join("");
}

async function loadAtms() {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Загрузка...</td></tr>';
  try {
    const resp = await fetch("/api/atm-monitor/atms");
    allAtms = await resp.json();
    document.getElementById("footerNote").textContent =
      `Банкоматов: ${allAtms.length} · обновлено ${new Date().toLocaleTimeString("ru-RU")}`;
    applyFilters();
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">Ошибка загрузки: ${e}</td></tr>`;
  }
}

document.querySelectorAll(".tab[data-status]").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    statusFilter = tab.dataset.status;
    applyFilters();
  });
});

document.querySelectorAll(".pill[data-conn]").forEach(pill => {
  pill.addEventListener("click", () => {
    document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    connFilter = pill.dataset.conn;
    applyFilters();
  });
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  applyFilters();
});

loadAtms();
setInterval(loadAtms, 60000); // авто-обновление раз в минуту
</script>
</body>
</html>
